name: Publicar

# A cada push na main, gera o BaraoTechExplode.exe e atualiza a release "latest" (sempre a versão mais nova).
# Ao criar uma tag (ex.: v0.12), gera também uma release fixa dessa versão.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar (arquivo único, com o .NET embutido)
        run: dotnet publish ResetExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Verificar persistência e restauração (backends simulados)
        run: dotnet run --project tests/OptimizationChecks/OptimizationChecks.csproj -c Release

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path dist/BaraoTechExplode.exe, dist/LEIA-ME.txt, dist/LICENSE -DestinationPath BaraoTechExplode.zip

      - name: Atualizar release "latest"
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          gh release delete latest --cleanup-tag --yes
          gh release create latest BaraoTechExplode.zip dist/BaraoTechExplode.exe --target $env:GITHUB_SHA --latest --title "BaraoTechExplode (versão mais recente)" --notes-file NOVIDADES.md

      - name: Release da versão (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME BaraoTechExplode.zip dist/BaraoTechExplode.exe --title "BaraoTechExplode $env:GITHUB_REF_NAME" --generate-notes --latest=false
